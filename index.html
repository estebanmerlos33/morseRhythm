<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morse Rhythm</title>
<meta name="description" content="Genera palabras o letras al azar y practica su traducción a código morse y a patrón numérico rítmico.">
<meta name="theme-color" content="#132420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morse Rhythm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Morse Rhythm</h1>
    <p class="sub" id="subText">Elegí cuántas letras querés y generá una combinación al azar para practicar su patrón morse.</p>

    <div class="mode-tabs">
      <button class="mode-tab active" id="modeNormal" type="button">Letra → Morse</button>
      <button class="mode-tab" id="modeInverso" type="button">Morse → Letra</button>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="runManual" type="button">Manual</button>
      <button class="mode-tab" id="runAuto" type="button">Automático</button>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="sourceEs" type="button">Español</button>
      <button class="mode-tab" id="sourceEn" type="button">Inglés</button>
      <button class="mode-tab" id="sourceRandom" type="button">Aleatorio</button>
    </div>

    <div class="control">
      <label for="len">Letras</label>
      <input type="range" id="len" min="3" max="10" value="4">
      <span class="count" id="countLabel">4</span>
    </div>

    <div class="code-params">
      <div class="code-param">
        <label for="valRaya">raya —</label>
        <div class="num-wrap">
          <input type="number" id="valRaya" value="4">
          <span class="num-arrows">
            <button type="button" class="arrow-btn" data-step-target="valRaya" data-step="1" aria-label="Aumentar">▲</button>
            <button type="button" class="arrow-btn" data-step-target="valRaya" data-step="-1" aria-label="Disminuir">▼</button>
          </span>
        </div>
      </div>
      <div class="code-param">
        <label for="valPunto">punto ·</label>
        <div class="num-wrap">
          <input type="number" id="valPunto" value="3">
          <span class="num-arrows">
            <button type="button" class="arrow-btn" data-step-target="valPunto" data-step="1" aria-label="Aumentar">▲</button>
            <button type="button" class="arrow-btn" data-step-target="valPunto" data-step="-1" aria-label="Disminuir">▼</button>
          </span>
        </div>
      </div>
      <div class="code-param">
        <label for="valEspacio">espacio</label>
        <div class="num-wrap">
          <input type="number" id="valEspacio" value="2">
          <span class="num-arrows">
            <button type="button" class="arrow-btn" data-step-target="valEspacio" data-step="1" aria-label="Aumentar">▲</button>
            <button type="button" class="arrow-btn" data-step-target="valEspacio" data-step="-1" aria-label="Disminuir">▼</button>
          </span>
        </div>
      </div>
      <div class="code-all">
        <button type="button" class="arrow-btn" data-step-all="1" aria-label="Aumentar todos" title="Aumentar todos">▲</button>
        <button type="button" class="arrow-btn" data-step-all="-1" aria-label="Disminuir todos" title="Disminuir todos">▼</button>
      </div>
    </div>

    <div class="auto-panel" id="autoPanel" style="display:none">
      <div class="auto-row" style="display:none">
        <label class="switch">
          <input type="checkbox" id="autoToggle">
          <span class="switch-track"></span>
        </label>
        <span>Generación automática</span>
      </div>
      <div class="auto-controls disabled" id="autoControls">
        <div class="bpm-display">
          <span class="metronome-dot" id="metronomeDot"></span>
          <span class="bpm-value" id="bpmValue">90</span>
          <span class="bpm-label">BPM</span>
          <select id="subdivisionSelect" aria-label="Figura rítmica">
            <option value="1">♩ Negra</option>
            <option value="0.5">♪ Corchea</option>
            <option value="0.25" selected>♬ Semicorchea</option>
            <option value="0.3333333333">♪ ³ Tresillo</option>
            <option value="0.1666666667">♬ ³ Tresillo</option>
          </select>
        </div>
        <div class="bpm-edit">
          <input type="range" id="bpmRange" min="30" max="240" value="90">
          <input type="number" id="bpmNumber" min="30" max="240" value="90">
        </div>

        <div class="sound-panel">
          <div class="auto-row">
            <label class="switch">
              <input type="checkbox" id="soundToggle">
              <span class="switch-track"></span>
            </label>
            <span>Metrónomo Principal</span>
          </div>
          <div class="sound-controls disabled" id="soundControls">
            <div class="slider-row">
              <label for="toneRange">Tono <span id="toneValue">(800Hz)</span></label>
              <input type="range" id="toneRange" min="200" max="1500" value="800">
            </div>
            <div class="slider-row">
              <label for="volumeRange">Volumen</label>
              <input type="range" id="volumeRange" min="0" max="100" value="30">
            </div>

            <div class="sound-panel">
              <div class="auto-row">
                <label class="switch">
                  <input type="checkbox" id="subSoundToggle">
                  <span class="switch-track"></span>
                </label>
                <span>Subdivisión</span>
              </div>
              <div class="sound-controls disabled" id="subSoundControls">
                <div class="slider-row">
                  <label for="subToneRange">Tono <span id="subToneValue">(600Hz)</span></label>
                  <input type="range" id="subToneRange" min="200" max="1500" value="600">
                </div>
                <div class="slider-row">
                  <label for="subVolumeRange">Volumen</label>
                  <input type="range" id="subVolumeRange" min="0" max="100" value="18">
                </div>
              </div>
            </div>

            <div class="sound-panel">
              <div class="auto-row">
                <label class="switch">
                  <input type="checkbox" id="morseSoundToggle">
                  <span class="switch-track"></span>
                </label>
                <span>Morse</span>
              </div>
              <div class="sound-controls disabled" id="morseSoundControls">
                <div class="slider-row">
                  <label for="morseToneRange">Tono <span id="morseToneValue">(1000Hz)</span></label>
                  <input type="range" id="morseToneRange" min="200" max="1500" value="1000">
                </div>
                <div class="slider-row">
                  <label for="morseVolumeRange">Volumen</label>
                  <input type="range" id="morseVolumeRange" min="0" max="100" value="60">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="rhythm-counter" id="rhythmCounterRow">
      <span class="tag">compás</span>
      <span class="value" id="rhythmCounterText">—</span>
    </p>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="tape">
      <div class="word placeholder" id="word">tocá generar</div>
    </div>

    <p class="next-preview" id="nextPreviewRow">
      <span class="tag">siguiente palabra</span>
      <span class="value" id="nextWordText">····</span>
    </p>

    <div class="readout">
      <div class="readout-row">
        <span class="tag">morse</span>
        <span class="value empty" id="morseOut">—</span>
      </div>
      <div class="readout-row">
        <span class="tag">dígitos</span>
        <span class="value empty" id="digitsOut">—</span>
      </div>
    </div>

    <p class="hide-toggle">
      <label class="switch">
        <input type="checkbox" id="hideToggle" checked>
        <span class="switch-track"></span>
      </label>
      <span>Mantener oculto</span>
    </p>

    <div class="fixed-word-panel" id="fixedWordPanel" style="display:none">
      <div class="auto-row">
        <label class="switch">
          <input type="checkbox" id="fixedWordToggle">
          <span class="switch-track"></span>
        </label>
        <span>Practicar palabra fija</span>
      </div>
      <div class="fixed-word-controls disabled" id="fixedWordControls">
        <input type="text" id="fixedWordInput" maxlength="10" placeholder="Escribí una palabra (1-10 letras)">
        <button type="button" id="pinCurrentBtn">Fijar palabra actual</button>
      </div>
    </div>

    <button id="genBtn">Generar</button>
  </main>

<script src="app.js"></script>
</body>
</html>
