<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de palabras — Morse</title>
<meta name="description" content="Genera palabras o letras al azar y practica su traducción a código morse y a patrón numérico rítmico.">
<meta name="theme-color" content="#132420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132420;
    --ink-2:#1c332d;
    --paper:#f1e7d3;
    --paper-dim:#d9c9a8;
    --brass:#c9903f;
    --brass-bright:#e0ab5c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Newsreader',serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#132420; --ink-2:#1c332d; --paper:#f1e7d3; --paper-dim:#d9c9a8;
    }
  }

  .card{
    width:100%;
    max-width:460px;
    background:var(--ink-2);
    border:1px solid #2b4038;
    border-radius:6px;
    padding:36px 32px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }

  h1{
    font-size:1.5rem;
    font-weight:600;
    font-style:italic;
    margin:0 0 4px;
    letter-spacing:.2px;
  }
  .sub{
    font-size:.85rem;
    color:var(--paper-dim);
    margin:0 0 24px;
    line-height:1.5;
  }

  .mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:24px;
    border-bottom:1px solid #2b4038;
    padding-bottom:0;
  }
  .mode-tab{
    flex:1;
    background:none;
    border:none;
    color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:10px 4px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s ease, border-color .15s ease;
  }
  .mode-tab.active{
    color:var(--brass-bright);
    border-bottom-color:var(--brass);
  }
  .mode-tab:hover{ color:var(--paper); }
  @media (prefers-reduced-motion: reduce){
    .mode-tab{ transition:none; }
  }

  .control{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }
  .control label{
    font-size:.85rem;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  input[type=range]{
    flex:1;
    accent-color:var(--brass);
    height:2px;
  }
  .count{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:1.1rem;
    color:var(--brass-bright);
    min-width:1.4em;
    text-align:right;
  }

  .code-params{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:26px;
  }
  .code-param{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:rgba(0,0,0,.15);
    border:1px solid #2b4038;
    border-radius:4px;
    padding:10px 6px;
  }
  .code-param label{
    font-size:.68rem;
    color:var(--paper-dim);
    text-transform:lowercase;
  }
  .code-param input[type=number]{
    width:100%;
    background:var(--ink);
    color:var(--brass-bright);
    border:1px solid #2b4038;
    border-radius:3px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:1rem;
    text-align:center;
    padding:5px 2px;
  }
  .code-param input[type=number]:focus-visible{
    outline:2px solid var(--brass-bright);
    outline-offset:1px;
  }

  .auto-panel{
    background:rgba(0,0,0,.15);
    border:1px solid #2b4038;
    border-radius:4px;
    padding:14px 16px;
    margin-bottom:26px;
  }
  .auto-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .auto-row span{
    font-size:.8rem;
    color:var(--paper-dim);
  }
  .switch{
    position:relative;
    width:38px;
    height:22px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;
    width:0;
    height:0;
  }
  .switch-track{
    position:absolute;
    inset:0;
    background:#2b4038;
    border-radius:22px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .switch-track::before{
    content:'';
    position:absolute;
    width:16px; height:16px;
    left:3px; top:3px;
    background:var(--paper-dim);
    border-radius:50%;
    transition:transform .15s ease, background .15s ease;
  }
  .switch input:checked + .switch-track{ background:var(--brass); }
  .switch input:checked + .switch-track::before{
    transform:translateX(16px);
    background:#1b1204;
  }
  @media (prefers-reduced-motion: reduce){
    .switch-track, .switch-track::before{ transition:none; }
  }

  .auto-controls{
    display:grid;
    gap:12px;
  }
  .auto-controls.disabled{
    opacity:.4;
    pointer-events:none;
  }
  .bpm-display{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .metronome-dot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--paper-dim);
    flex-shrink:0;
    transition:transform .08s ease, background .08s ease;
  }
  .metronome-dot.beat{
    transform:scale(1.5);
    background:var(--brass-bright);
  }
  .bpm-value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:1.2rem;
    color:var(--brass-bright);
  }
  .bpm-label{
    font-size:.7rem;
    color:var(--paper-dim);
  }
  .bpm-edit{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .bpm-edit input[type=range]{ flex:1; }
  .bpm-edit input[type=number]{
    width:56px;
    background:var(--ink);
    color:var(--brass-bright);
    border:1px solid #2b4038;
    border-radius:3px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.9rem;
    text-align:center;
    padding:5px 2px;
  }
  #subdivisionSelect{
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:1px solid #2b4038;
    border-radius:3px;
    font-family:'IBM Plex Mono',monospace;
    font-size:.8rem;
    padding:8px;
  }
  .sound-panel{
    border-top:1px solid #2b4038;
    margin-top:4px;
    padding-top:12px;
  }
  .sound-controls{
    display:grid;
    gap:10px;
    margin-top:10px;
  }
  .sound-controls.disabled{
    opacity:.4;
    pointer-events:none;
  }
  .slider-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .slider-row label{
    font-size:.75rem;
    color:var(--paper-dim);
    min-width:56px;
  }
  .slider-row input[type=range]{ flex:1; }
  .progress-track{
    height:3px;
    background:#2b4038;
    border-radius:2px;
    overflow:hidden;
    margin:-14px 0 22px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--brass);
  }
  .rhythm-counter{
    display:none;
    align-items:baseline;
    gap:10px;
    margin:-8px 0 22px;
  }
  .rhythm-counter.visible{ display:flex; }
  .rhythm-counter .tag{
    font-size:.7rem;
    font-family:'Newsreader',serif;
    font-style:italic;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .rhythm-counter .value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.05em;
    color:var(--brass-bright);
  }
  @media (prefers-reduced-motion: reduce){
    .metronome-dot{ transition:none; }
  }

  .tape{
    background:var(--paper);
    color:var(--ink);
    border-radius:3px;
    padding:26px 18px;
    min-height:88px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
    position:relative;
    overflow-x:auto;
  }
  .tape::before, .tape::after{
    content:'';
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:10px; height:10px;
    border-radius:50%;
    background:var(--ink-2);
  }
  .tape::before{ left:8px; }
  .tape::after{ right:8px; }
  .word{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:clamp(1.4rem, 6vw, 2.1rem);
    letter-spacing:.12em;
    white-space:nowrap;
  }
  .word.placeholder{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-weight:500;
    font-size:1rem;
    letter-spacing:0;
    color:#8a8072;
  }
  .word.hidden{
    filter:blur(8px);
    user-select:none;
  }

  .next-preview{
    display:none;
    align-items:baseline;
    gap:10px;
    margin:-10px 0 22px;
  }
  .next-preview.visible{
    display:flex;
  }
  .next-preview .tag{
    font-size:.7rem;
    font-family:'Newsreader',serif;
    font-style:italic;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .next-preview .value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.1em;
    color:#8a938d;
  }

  .readout{
    margin-bottom:22px;
    display:grid;
    gap:10px;
  }
  .readout-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .readout-row .tag{
    font-size:.7rem;
    text-transform:lowercase;
    color:var(--paper-dim);
    font-family:'Newsreader',serif;
    font-style:italic;
    min-width:60px;
  }
  .readout-row .value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.08em;
    color:var(--brass-bright);
    word-break:break-all;
  }
  .readout-row .value.empty{
    color:#5a6e66;
    font-family:'Newsreader',serif;
    font-style:italic;
    font-weight:500;
    letter-spacing:0;
  }
  .readout-row .value.hidden{
    filter:blur(7px);
    user-select:none;
  }
  .hide-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    margin:-4px 0 22px;
  }
  .hide-toggle span{
    font-size:.8rem;
    color:var(--paper-dim);
  }

  button{
    width:100%;
    background:var(--brass);
    color:#1b1204;
    border:none;
    border-radius:4px;
    padding:14px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.95rem;
    letter-spacing:.04em;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--brass-bright); }
  button:active{ transform:scale(.98); }
  button:focus-visible{ outline:2px solid var(--brass-bright); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce){
    button{ transition:none; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Generador de letras</h1>
    <p class="sub" id="subText">Elegí cuántas letras querés y generá una combinación al azar para practicar su patrón morse.</p>

    <div class="mode-tabs">
      <button class="mode-tab active" id="modeNormal" type="button">Letra → Morse</button>
      <button class="mode-tab" id="modeInverso" type="button">Morse → Letra</button>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="sourceRandom" type="button">Aleatorio</button>
      <button class="mode-tab" id="sourceEs" type="button">Español</button>
      <button class="mode-tab" id="sourceEn" type="button">Inglés</button>
    </div>

    <div class="control">
      <label for="len">Letras</label>
      <input type="range" id="len" min="1" max="10" value="4">
      <span class="count" id="countLabel">4</span>
    </div>

    <div class="code-params">
      <div class="code-param">
        <label for="valRaya">raya —</label>
        <input type="number" id="valRaya" value="4">
      </div>
      <div class="code-param">
        <label for="valPunto">punto ·</label>
        <input type="number" id="valPunto" value="3">
      </div>
      <div class="code-param">
        <label for="valEspacio">espacio</label>
        <input type="number" id="valEspacio" value="2">
      </div>
    </div>

    <div class="auto-panel">
      <div class="auto-row">
        <label class="switch">
          <input type="checkbox" id="autoToggle">
          <span class="switch-track"></span>
        </label>
        <span>Generación automática</span>
      </div>
      <div class="auto-controls disabled" id="autoControls">
        <div class="bpm-display">
          <span class="metronome-dot" id="metronomeDot"></span>
          <span class="bpm-value" id="bpmValue">90</span>
          <span class="bpm-label">BPM</span>
        </div>
        <div class="bpm-edit">
          <input type="range" id="bpmRange" min="30" max="240" value="90">
          <input type="number" id="bpmNumber" min="30" max="240" value="90">
        </div>
        <select id="subdivisionSelect">
          <option value="1">Negra (♩)</option>
          <option value="0.5" selected>Corchea (♪)</option>
          <option value="0.25">Semicorchea</option>
          <option value="0.3333333333">Tresillo de corcheas</option>
          <option value="0.1666666667">Tresillo de semicorcheas</option>
        </select>

        <div class="sound-panel">
          <div class="auto-row">
            <label class="switch">
              <input type="checkbox" id="soundToggle">
              <span class="switch-track"></span>
            </label>
            <span>Sonido del metrónomo</span>
          </div>
          <div class="sound-controls disabled" id="soundControls">
            <div class="slider-row">
              <label for="toneRange">Tono</label>
              <input type="range" id="toneRange" min="200" max="1500" value="800">
            </div>
            <div class="slider-row">
              <label for="volumeRange">Volumen</label>
              <input type="range" id="volumeRange" min="0" max="100" value="60">
            </div>

            <div class="sound-panel">
              <div class="auto-row">
                <label class="switch">
                  <input type="checkbox" id="subSoundToggle">
                  <span class="switch-track"></span>
                </label>
                <span>Sonido de subdivisión</span>
              </div>
              <div class="sound-controls disabled" id="subSoundControls">
                <div class="slider-row">
                  <label for="subToneRange">Tono</label>
                  <input type="range" id="subToneRange" min="200" max="1500" value="1200">
                </div>
                <div class="slider-row">
                  <label for="subVolumeRange">Volumen</label>
                  <input type="range" id="subVolumeRange" min="0" max="100" value="35">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <p class="rhythm-counter" id="rhythmCounterRow">
      <span class="tag">compás</span>
      <span class="value" id="rhythmCounterText">—</span>
    </p>

    <div class="tape">
      <div class="word placeholder" id="word">tocá generar</div>
    </div>

    <p class="next-preview" id="nextPreviewRow">
      <span class="tag">siguiente palabra</span>
      <span class="value" id="nextWordText">····</span>
    </p>

    <div class="readout">
      <div class="readout-row">
        <span class="tag">morse</span>
        <span class="value empty" id="morseOut">—</span>
      </div>
      <div class="readout-row">
        <span class="tag">dígitos</span>
        <span class="value empty" id="digitsOut">—</span>
      </div>
    </div>

    <p class="hide-toggle">
      <label class="switch">
        <input type="checkbox" id="hideToggle">
        <span class="switch-track"></span>
      </label>
      <span>Mantener oculto</span>
    </p>

    <button id="genBtn">Generar</button>
  </main>

<script>
  const MORSE = {
    A:'.-', B:'-...', C:'-.-.', D:'-..', E:'.', F:'..-.', G:'--.',
    H:'....', I:'..', J:'.---', K:'-.-', L:'.-..', M:'--', N:'-.',
    Ñ:'--.--', O:'---', P:'.--.', Q:'--.-', R:'.-.', S:'...', T:'-',
    U:'..-', V:'...-', W:'.--', X:'-..-', Y:'-.--', Z:'--..'
  };

  // Bancos de palabras reales, verificadas letra por letra (longitud exacta),
  // agrupadas por cantidad de letras. Solo cubren 3-10 letras.
  const WORDS_ES = {
    3: ["SOL","MAR","PAN","OJO","PIE","SAL","RIO","LUZ","VOZ","RED","AVE","OSO","PEZ","TEA","UVA","COZ","AJI","SUR","RIA","FIN","LEY","REY","LEA","TOS","AMO","ODA","ALA","ATA","BOA","CAL","CAN","COL","CON","CUY","DIA","DOY","DOS","EJE","ERA","ESA","ESE","ESO","FEO","GAS","GEN","HOY","HUY","IBA","LAS","LES","LOS","MAL","MAS","MES","MIO","MIS","NOS","OIA","OLA","ORO","OSA","PAZ","PIN","PUS","QUE","SEA","SED","SER","SET","SIN","SUS","TAL","TAN","TEN","TIO","TUS","VAN","VAS","VEZ","VID","VIL","VIO","VOY","AÑO"],
    4: ["CASA","MESA","LUNA","GATO","MONO","LEON","OSOS","PATO","VACA","RANA","FLOR","HOJA","NUBE","FRIO","LOBO","CAMA","SOFA","ROPA","CAFE","SOPA","JUGO","VINO","VIDA","AMOR","BESO","RISA","HIJO","TIOS","PAIS","NIÑA","MANO","PIEL","OJOS","BOCA","DEDO","CODO","TAZA","ROJO","AZUL","ROSA","AGUA"],
    5: ["PLAYA","MONTE","VERDE","NEGRO","PLATA","COBRE","METAL","PAPEL","TELAS","LANAS","SEDAS","CUERO","GOMAS","FIBRA","HUMOR","RISAS","ENOJO","MIEDO","CALMA","PACES","ODIOS","CELOS","VALOR","DEBIL","LENTO","ALTOS","BAJOS","ANCHO","OVALO","PUNTO","LINEA","CUBOS","PLANO","CALOR","FRIOS","TIBIO","SECOS","SUCIO","NUEVO","VIEJO","JOVEN","CHICO","MEDIA","PARTE","TODOS","NADAS","VARIO","MUCHO","POCOS","TANTO","LIBRO","PERRO","OVEJA","CERDO","NIEVE","ARBOL","PARED","TECHO","SUELO","COCHE","PLATO","GORRA","LECHE","CARNE","PASTA","CIELO","MUNDO","PADRE","MUJER","NORTE","FUEGO"],
    6: ["CAMINO","PUEBLO","CIUDAD","PARQUE","PLAZAS","TIENDA","BANCOS","TEATRO","CINEMA","MUSICA","LITERA","POESIA","NOVELA","CUENTO","DANZAS","CANTOS","BAILES","FIESTA","VIAJES","PRIMOS","NIETOS","ABUELA","MADRES","PADRES","ESPOSO","ESPOSA","NOVIOS","AMANTE","VECINO","COLEGA","ALUMNO","OBRERO","PINTOR","POETAS","MUSICO","CANTAN","BAILAR","ACTRIZ","CAMARA","SONIDO","IMAGEN","VIDEOS","REPTIL","DELFIN","VOLCAN","DINERO","CORAJE"],

  let nextWord = null;

  // --- Reloj único (scheduler) ---
  // Tanto el pulso del metrónomo como el avance de palabra se calculan como
  // tiempos absolutos desde un mismo origen (originTime), multiplicando por
  // una cantidad entera de pulsos/ticks — nunca sumando delay sobre delay.
  // Así se elimina el desfasaje técnico entre ambos relojes; el desfasaje
  // "musical" (una palabra que no termina justo en un pulso) es esperado.
  let schedulerHandle = null;
  let originTime = 0;
  let beatMs = 0;
  let tickMs = 0;
  let beatCount = 0;
  let subTickCount = 0;
  let cumulativeTicks = 0;

  let audioCtx = null;

  // Denominador "real" (múltiplo de 2) y paso por tick para cada subdivisión.
  // Puntillo cuenta en la subdivisión recta inmediatamente menor (x3 pasos);
  // los tresillos usan el denominador de la subdivisión que dividen, con etiqueta.
  const SUBDIVISION_INFO = {
    "1":            { denom: 4,  step: 1, tresillo: false }, // negra
    "0.5":          { denom: 8,  step: 1, tresillo: false }, // corchea
    "0.25":         { denom: 16, step: 1, tresillo: false }, // semicorchea
    "0.3333333333": { denom: 8,  step: 1, tresillo: true  }, // tresillo de corcheas
    "0.1666666667": { denom: 16, step: 1, tresillo: true  }  // tresillo de semicorcheas
  };
  function getSubdivisionInfo(){
    return SUBDIVISION_INFO[subdivisionSelect.value] || { denom: 4, step: 1, tresillo: false };
  }

  function ensureAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playClick(){
    if(!soundToggle.checked) return;
    ensureAudioCtx();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = parseFloat(toneRange.value);
    const vol = parseFloat(volumeRange.value) / 100;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.09);
  }

  // Tick de subdivisión: más corto que el pulso principal para que se
  // distinga como un "tick" liviano debajo del click del compás.
  function playSubClick(){
    if(!soundToggle.checked || !subSoundToggle.checked) return;
    ensureAudioCtx();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = parseFloat(subToneRange.value);
    const vol = parseFloat(subVolumeRange.value) / 100;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.05);
  }

  let mode = 'normal'; // 'normal' = letra→morse, 'inverso' = morse→letra

  len.addEventListener('input', () => {

  function randomWord(n){
    let out = '';
    for(let i=0;i<n;i++){
      out += ABC[Math.floor(Math.random()*ABC.length)];
    }
    return out;
  }

  // Con fuente ES/EN, se elige una palabra real del banco correspondiente
  // a esa longitud exacta. Con "Aleatorio" se generan letras sueltas.
  function pickWord(n){
    if(wordSource === 'random') return randomWord(n);
    const bank = wordSource === 'es' ? WORDS_ES : WORDS_EN;
    const bucket = bank[n];
    if(!bucket || bucket.length === 0) return randomWord(n); // resguardo
    return bucket[Math.floor(Math.random() * bucket.length)];
  }

  function setSource(newSource){
    wordSource = newSource;
    sourceRandom.classList.toggle('active', wordSource === 'random');
    sourceEs.classList.toggle('active', wordSource === 'es');
    sourceEn.classList.toggle('active', wordSource === 'en');

    // Con palabras reales, el rango de letras se restringe a >= 3
    // (nuestros bancos solo cubren 3 a 10 letras).
    const minLen = wordSource === 'random' ? 1 : 3;
    len.min = String(minLen);
    if(parseInt(len.value, 10) < minLen){
      len.value = String(minLen);
    }
    // El navegador puede clampear len.value apenas cambia min, así que
    // sincronizamos la etiqueta con el valor real en vez de asumirlo.
    countLabel.textContent = len.value;
    refreshNextPreview();
  }

  sourceRandom.addEventListener('click', () => setSource('random'));
  sourceEs.addEventListener('click', () => setSource('es'));
  sourceEn.addEventListener('click', () => setSource('en'));

  function toMorse(w){
    return w.split('').map(ch => MORSE[ch]).join(' / ');
  }

  // raya, punto y espacio entre letras son configurables por el usuario
  function toDigits(w){
    const raya = valRaya.value;
    const punto = valPunto.value;
    const espacio = valEspacio.value;
    return w.split('').map(ch =>
      MORSE[ch].split('').map(sym => sym === '-' ? raya : punto).join('')
    ).join(espacio);
  }

  const SUB_TEXT = {
    normal: 'Elegí cuántas letras querés y generá una combinación al azar para practicar su patrón morse.',
    inverso: 'Vas a ver el morse y los dígitos primero. Adiviná la letra antes de revelarla.'
  };

  function setMode(newMode){
    mode = newMode;
    modeNormal.classList.toggle('active', mode === 'normal');
    modeInverso.classList.toggle('active', mode === 'inverso');
    subText.textContent = SUB_TEXT[mode];
    if(!hasGenerated){
      word.textContent = mode === 'normal' ? 'tocá generar' : '? ? ?';
    } else {
      applyVisibility();
    }
  }

  modeNormal.addEventListener('click', () => setMode('normal'));
  modeInverso.addEventListener('click', () => setMode('inverso'));

  function getBpm(){
    return parseInt(bpmRange.value, 10);
  }
  function getSubdivisionFactor(){
    return parseFloat(subdivisionSelect.value);
  }
  function sumDigits(digitsStr){
    return digitsStr.split('').reduce((acc, ch) => acc + parseInt(ch, 10), 0);
  }

  // Vacía al instante y llena linealmente hasta el fin real de la palabra.
  function startProgress(remainingMs, startFraction = 0){
    progressFill.style.transition = 'none';
    progressFill.style.width = (startFraction * 100) + '%';
    void progressFill.offsetWidth; // forzar reflow para reiniciar la transición
    progressFill.style.transition = `width ${remainingMs}ms linear`;
    progressFill.style.width = '100%';
  }
  function stopProgress(){
    progressFill.style.transition = 'none';
    progressFill.style.width = '0%';
  }

  function beatPulse(){
    metronomeDot.classList.add('beat');
    setTimeout(() => metronomeDot.classList.remove('beat'), 100);
    playClick();
  }

  // Reinicia el origen del reloj: se usa al activar el modo automático o
  // cuando cambian BPM/subdivisión (ambos redefinen la duración del pulso).
  function resetEpoch(){
    originTime = performance.now();
    beatMs = 60000 / getBpm();
    tickMs = beatMs * getSubdivisionFactor();
    beatCount = 0;
    subTickCount = 0;
    cumulativeTicks = 0;
  }

  function startScheduler(){
    stopScheduler();
    resetEpoch();
    schedulerHandle = setInterval(schedulerTick, 20);
  }

  function stopScheduler(){
    if(schedulerHandle){ clearInterval(schedulerHandle); schedulerHandle = null; }
    metronomeDot.classList.remove('beat');
    stopProgress();
    currentWordTotalTicks = 0;
    lastTickInWord = -1;
    rhythmCounterText.textContent = '—';
  }

  // Muestra "posición/den : total/den" (+ " - Tresillo" si corresponde)
  function updateRhythmCounter(tickInWord, totalTicks){
    const info = getSubdivisionInfo();
    const cur = tickInWord * info.step;
    const tot = totalTicks * info.step;
    const label = info.tresillo ? ' - Tresillo' : '';
    rhythmCounterText.textContent = `${cur}/${info.denom} : ${tot}/${info.denom}${label}`;
  }

  function schedulerTick(){
    const now = performance.now();
    const nextBeatTime = originTime + beatCount * beatMs;
    if(now >= nextBeatTime){
      beatPulse();
      beatCount++;
    }
    const nextSubTickTime = originTime + subTickCount * tickMs;
    if(now >= nextSubTickTime){
      playSubClick();
      subTickCount++;
    }
    const nextWordTime = originTime + cumulativeTicks * tickMs;
    if(autoToggle.checked && now >= nextWordTime){
      generate();
    }
    // Posición actual dentro de la palabra (1..total), sincronizada al reloj único
    if(autoToggle.checked && currentWordTotalTicks > 0){
      const wordStart = originTime + currentWordStartTicks * tickMs;
      let t = Math.floor((now - wordStart) / tickMs) + 1;
      t = Math.max(1, Math.min(currentWordTotalTicks, t));
      if(t !== lastTickInWord){
        lastTickInWord = t;
        updateRhythmCounter(t, currentWordTotalTicks);
      }
    }
  }

  // Avanza el contador de ticks en base a la palabra recién generada, y
  // arranca la barra de progreso con la duración real de esa palabra.
  // Usa Math.max con el tiempo transcurrido para no quedar "atrasado" si
  // generate() se disparó manualmente en vez de por el scheduler.
  function advanceWordSchedule(w){
    if(!autoToggle.checked) return;
    const totalTicks = sumDigits(toDigits(w));
    const now = performance.now();
    const elapsedTicks = (now - originTime) / tickMs;
    // Disparo del scheduler (llegó la hora): la palabra arranca exactamente en
    // la grilla, sin saltear ticks aunque el poll llegue unos ms tarde.
    // Disparo manual (antes de tiempo): arranca en el próximo tick de la grilla.
    const startTicks = elapsedTicks >= cumulativeTicks
      ? Math.max(cumulativeTicks, Math.floor(elapsedTicks))
      : Math.ceil(elapsedTicks);
    cumulativeTicks = startTicks + totalTicks;
    currentWordStartTicks = startTicks;
    currentWordTotalTicks = totalTicks;
    lastTickInWord = 1;
    updateRhythmCounter(1, totalTicks);

    // La barra se alinea al inicio/fin reales de la palabra en la grilla.
    const wordStartMs = originTime + startTicks * tickMs;
    const wordEndMs = wordStartMs + tickMs * totalTicks;
    const startFraction = Math.max(0, (now - wordStartMs) / (wordEndMs - wordStartMs));
    startProgress(Math.max(0, wordEndMs - now), startFraction);
  }

  // Según el checkbox "Mantener oculto", la incógnita del modo actual
  // queda siempre visible (por defecto) o siempre oculta.
  function applyVisibility(){
    const shouldHide = hideToggle.checked;
    const targets = mode === 'normal' ? [morseOut, digitsOut] : [word];
    const others = mode === 'normal' ? [word] : [morseOut, digitsOut];
    targets.forEach(el => el.classList.toggle('hidden', shouldHide));
    others.forEach(el => el.classList.remove('hidden'));
  }

  // La "siguiente palabra" se precomputa para poder mostrarla de antemano;
  // al generar, se convierte en la actual y se calcula una nueva para el preview.
  function refreshNextPreview(){
    nextWord = pickWord(parseInt(len.value,10));
    nextWordText.textContent = nextWord;
  }

  function generate(){
    const w = nextWord || pickWord(parseInt(len.value,10));
    hasGenerated = true;

    morseOut.textContent = toMorse(w);
    morseOut.classList.remove('empty');

    digitsOut.textContent = toDigits(w);
    digitsOut.classList.remove('empty');

    word.classList.remove('placeholder');
    word.textContent = w;

    applyVisibility();
    refreshNextPreview();
    advanceWordSchedule(w);
  }

  refreshNextPreview();
  genBtn.addEventListener('click', generate);
  hideToggle.addEventListener('change', applyVisibility);

  autoToggle.addEventListener('change', () => {
    autoControls.classList.toggle('disabled', !autoToggle.checked);
    nextPreviewRow.classList.toggle('visible', autoToggle.checked);
    rhythmCounterRow.classList.toggle('visible', autoToggle.checked);
    if(autoToggle.checked){
      startScheduler();
      generate();
    } else {
      stopScheduler();
    }
  });

  bpmRange.addEventListener('input', () => {
    bpmNumber.value = bpmRange.value;
    bpmValue.textContent = bpmRange.value;
    if(autoToggle.checked) resetEpoch();
  });

  bpmNumber.addEventListener('input', () => {
    let v = parseInt(bpmNumber.value, 10);
    if(isNaN(v)) return;
    v = Math.min(240, Math.max(30, v));
    bpmRange.value = v;
    bpmValue.textContent = v;
    if(autoToggle.checked) resetEpoch();
  });

  subdivisionSelect.addEventListener('change', () => {
    if(autoToggle.checked){
      resetEpoch();
      currentWordTotalTicks = 0; // la palabra en curso queda cortada por el reinicio de reloj
    }
  });

  soundToggle.addEventListener('change', () => {
    soundControls.classList.toggle('disabled', !soundToggle.checked);
    if(soundToggle.checked) ensureAudioCtx();
  });

  subSoundToggle.addEventListener('change', () => {
    subSoundControls.classList.toggle('disabled', !subSoundToggle.checked);
    if(subSoundToggle.checked) ensureAudioCtx();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('No se pudo registrar el service worker:', err);
      });
    });
  }
</script>
</body>
</html>
